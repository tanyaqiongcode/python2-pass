name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install validation deps
        run: pip install "matplotlib==3.10.6" "openpyxl==3.1.5"  # 与本地验证版本一致，锁定判题校验行为
      - name: Core logic unit tests
        run: node tools/tests.mjs
      - name: Post-run check negative tests (drawing / file output)
        run: python3 tools/test_checks.py
      - name: Validate & rebuild question bank
        run: python3 tools/build_data.py
      - name: Local practice pack end-to-end test (setup / pip install whl / check)
        run: python3 tools/test_packs.py
      - name: Check JS syntax
        run: |
          for f in js/*.js; do node --check "$f"; done
